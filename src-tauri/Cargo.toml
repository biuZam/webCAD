[package]
name = "leatherdraft"
version = "0.0.0"
description = "LeatherDraft desktop shell"
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[[bin]]
name = "leatherdraft"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
