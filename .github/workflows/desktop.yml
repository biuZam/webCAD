# Desktop installers (Tauri, src-tauri/). Tauri can't cross-compile, so each OS builds on its own runner:
# Windows → NSIS .exe, macOS → universal .dmg. Run by hand (artifacts only) or push a `desktop-v*` tag:
# `git tag desktop-v0.1.0 && git push origin desktop-v0.1.0` builds version 0.1.0 and publishes a GitHub Release.
name: Desktop

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
            artifact: src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            artifact: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # On a tag, the installer version comes from the tag (desktop-v0.1.0 → 0.1.0); otherwise tauri.conf.json's.
      - name: Build
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then
            pnpm tauri build ${{ matrix.args }} --config "{\"version\":\"${GITHUB_REF_NAME#desktop-v}\"}"
          else
            pnpm tauri build ${{ matrix.args }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: leatherdraft-${{ matrix.os }}
          path: ${{ matrix.artifact }}

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: LeatherDraft ${{ github.ref_name }}
          files: installers/*
          generate_release_notes: true
          body: |
            ## Downloads
            - **Windows**: `LeatherDraft_*_x64-setup.exe`
            - **macOS** (Apple Silicon + Intel): `LeatherDraft_*_universal.dmg`

            The installers are not code-signed yet. On Windows, click "More info → Run anyway" in SmartScreen.
            On macOS, right-click the app → Open the first time (or run `xattr -cr /Applications/LeatherDraft.app`).
